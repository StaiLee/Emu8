name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build · Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ebiten system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-dri xorg-dev libasound2-dev libxxf86vm-dev pkg-config xvfb
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -v ./...
      - run: go vet ./...
      # The emul8 package imports Ebiten, whose init() needs an X display even
      # for tests, so run the suite under a virtual framebuffer.
      - run: xvfb-run -a go test -v ./...
